server:
  port: ${SERVER_PORT:3000}

spring:
  application:
    name: medicare

  datasource:
    url: ${DB_URL:jdbc:mysql://medical-service-aurora-1.c3iagyqq461m.ap-northeast-2.rds.amazonaws.com:3306/medicalservicedb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin123$}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 50

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET:this-is-very-secret-key-this-is-very-secret-key}
  access-expiration: 1800000
  refresh-expiration: 604800000

app:
  encryption:
    secret-key: ${ENCRYPTION_KEY:defaultkeyfordevonly1234567890ab}
