server:
  port: ${SERVER_PORT:3000}

spring:
  application:
    name: medicare

  config:
    import: optional:file:.env[.properties]

  datasource:
    # 전체 JDBC URL은 SPRING_DATASOURCE_URL(또는 .env 동일 키)만 사용.
    # 미설정 시: DB_HOST(기본 localhost) + DB_PORT + DB_NAME 으로 조합.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:medicalservicedb}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 50

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 1800000
  refresh-expiration: 604800000

app:
  encryption:
    secret-key: ${ENCRYPTION_KEY}
