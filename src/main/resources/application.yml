server:
  port: 3000

spring:
  application:
    name: medicare

  config:
    import: classpath:verification-codes.yml

  datasource:
    url: jdbc:mysql://${DB_URL:localhost}:${DB_PORT:3306}/${DB_NAME:medicalservicedb}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 50

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}


jwt:
  secret: ${JWT_SECRET:this-is-very-secret-key-this-is-very-secret-key}
  access-expiration: 1800000
  refresh-expiration: 604800000

app:
  encryption:
    secret-key: ${ENCRYPTION_KEY:defaultkeyfordevonly1234567890ab}
